global:
route:
  receiver: Telegram
  group_by: ["alertname"]
  group_wait: 1s
  group_interval: 1s
  repeat_interval: 5s

  routes:
    - receiver: Telegram
      match:
        team: "finance"
    - receiver: Discord
      match:
        team: "mev"

receivers:
  - name: Telegram
    telegram_configs:
      - bot_token: "TELEGRAM_TOKEN"
        api_url: "https://api.telegram.org"
        chat_id: -1002213439700
        parse_mode: "Markdown"
        message: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"

  - name: Discord
    discord_configs:
      - webhook_url: "DISCORD_WEBHOOK_URL"
        message: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"