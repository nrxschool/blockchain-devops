genesis-file = "/config/dev.json"

miner-enabled = true
miner-coinbase = "0xfe3b557e8fb62b89f4916b721be55ceb828dbd73"
host-allowlist = ["*"]

## HTTP RPC API
rpc-http-enabled = true
rpc-http-cors-origins = ["*"]
rpc-http-host = "0.0.0.0"
rpc-http-port = 8545
rpc-http-api = ["ADMIN", "ETH", "NET", "WEB3", "TXPOOL"]

## METRICS API
metrics-enabled = true
metrics-host = "0.0.0.0"
metrics-port = 8548
metrics-category = [
    "BLOCKCHAIN",
    "PEERS",
    "PROCESS",
    "ETHEREUM",
    "TRANSACTION_POOL",
]

# BLOCKCHAIN DATA PATH 
data-path = "./blockchain/"
