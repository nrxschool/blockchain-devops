global:
route:
  receiver: Telegram
  group_by: ["alertname"]
  group_wait: 1s
  group_interval: 1s
  repeat_interval: 5s

  routes:
    - receiver: Telegram
      match:
        team: "finance"
    - receiver: Discord
      match:
        team: "mev"

receivers:
  - name: Telegram
    telegram_configs:
      - bot_token: "6763896640:AAHR6VtaFGXSH7d5UITR3dWmeVx_01mW_gQ"
        api_url: "https://api.telegram.org"
        chat_id: -1002213439700
        parse_mode: "Markdown"
        message: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"

  - name: Discord
    discord_configs:
      - webhook_url: "https://discord.com/api/webhooks/1253362740827787334/SgNSDC3EN9q6yPxJH6qW88XoW3f2YTNbnH8C1j1x8eTy6CDB_MbAuQTeT5tZ3S0sG57y"
        message: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"