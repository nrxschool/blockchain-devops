services:
  bootnode:
    container_name: master
    environment:
      - LOG4J_CONFIGURATION_FILE=/config/log-config.xml
    image: hyperledger/besu:latest
    volumes:
      - ./logs:/var/log/besu
      - ./:/config
    ports:
      - 8545:8545
    command: >
      --config-file=/config/besu.toml --node-private-key-file=/config/key
    networks:
      besu-network:
        ipv4_address: 10.10.0.11
    expose:
      - 8548
      - 30303

  besu2:
    depends_on:
      - bootnode
    image: hyperledger/besu:latest
    volumes:
      - ./:/config
    command: >
      --bootnodes="enode://4e8b70b62d75b526fc284741e72a0b64579a48d70641201986ec25191a2d570827c65bc1de0bab80ad2124c47fe6219eda6424f7df8fed1208d73dc7b7e2a3e8@10.10.0.11:30303" --config-file=/config/besu.toml
    networks:
      besu-network:
        ipv4_address: 10.10.0.12
    expose:
      - 8548
      - 30303

  besu3:
    depends_on:
      - bootnode
    image: hyperledger/besu:latest
    volumes:
      - ./:/config
    command: >
      --bootnodes="enode://4e8b70b62d75b526fc284741e72a0b64579a48d70641201986ec25191a2d570827c65bc1de0bab80ad2124c47fe6219eda6424f7df8fed1208d73dc7b7e2a3e8@10.10.0.11:30303" --config-file=/config/besu.toml
    networks:
      besu-network:
        ipv4_address: 10.10.0.13
    expose:
      - 8548
      - 30303

  besu4:
    depends_on:
      - bootnode
    image: hyperledger/besu:latest
    volumes:
      - ./:/config
    command: >
      --bootnodes="enode://4e8b70b62d75b526fc284741e72a0b64579a48d70641201986ec25191a2d570827c65bc1de0bab80ad2124c47fe6219eda6424f7df8fed1208d73dc7b7e2a3e8@10.10.0.11:30303" --config-file=/config/besu.toml
    networks:
      besu-network:
        ipv4_address: 10.10.0.14
    expose:
      - 8548
      - 30303

  promtail:
    image: grafana/promtail
    ports:
      - "9080:9080"
    volumes:
      - ./logs:/var/log/besu
      - ./promtail:/etc/promtail
    networks:
      - besu-network

  loki:
    image: grafana/loki
    ports:
      - "3100:3100"
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -print-config-stderr=true
    networks:
      - besu-network
    depends_on:
      - promtail

  grafana:
    image: grafana/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    ports:
      - "3000:3000"
    depends_on:
      - loki
    networks:
      - besu-network

networks:
  besu-network:
    name: drex
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "10.10.0.0/24"
          gateway: "10.10.0.1"

