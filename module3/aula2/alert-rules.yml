groups:
  - name: txmined
    rules:
      - alert: NewTransactionMined
        expr: increase(besu_blockchain_chain_head_transaction_count_counter_total[30s]) > 0
        for: 0s
        labels:
          team: finance
        annotations:
          summary: "New transaction mined on the blockchain"
          description: "A new transaction has been mined in the last 10 seconds."

  - name: txpool
    rules:
      - alert: NewTransactionInPool
        expr: increase(besu_transaction_pool_number_of_transactions{layer="prioritized"}[30s]) > 1
        for: 0s
        labels:
          team: mev
        annotations:
          summary: "New transaction received on mempool"
          description: "A new transaction has been add in mempool in the last 10 seconds."
