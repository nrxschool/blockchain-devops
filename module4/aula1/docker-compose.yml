networks:
  my_net:

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"

  influxdb:
    image: influxdb:1.8
    networks:
      - my_net
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6

  grafana:
    depends_on:
      - influxdb
    image: grafana/grafana:latest
    networks:
      - my_net
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
